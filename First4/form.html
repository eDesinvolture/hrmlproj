<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Форма бронирования</title>
</head>
<body class="form-page">
    <header class="hotels-header">
        <nav>
            <a href="index.html" class="nav-link">Отели</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
            <a href="reviews.html" class="nav-link">Отзывы</a>
        </nav>
    </header>

    <main class="form-main">
        <div class="form-container">
            <h1 class="form-title">Форма бронирования</h1>
            
            <form class="booking-form">
                <div class="form-group">
                    <label for="fullname">ФИО:</label>
                    <input 
                        type="text"
                        required
                        placeholder="Иванов Иван Иванович"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефона:</label>
                    <input 
                        type="tel"
                        required 
                        placeholder="+79201234567"
                    > 
                </div>

                <button type="submit" class="submit-button">Отправить заявку</button>
            </form>
        </div>
    </main>

    <footer class="hotels-footer">
        <div class="footer-left">
            <p>Мы в соц.сетях:</p>
            <div class="social-links">
                <a href="#">VK</a>
                <a href="#">Instagram</a>
            </div>
        </div>
        <div class="footer-right">
            <a href="#">Политика конфиденциальности</a>
        </div>
    </footer>
</body>
</html>
