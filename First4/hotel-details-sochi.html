<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Детали отеля</title>
</head>
<body class="hotels-page">
    <header class="hotels-header">
        <nav>
            <a href="index.html" class="nav-link">Отели</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
            <a href="reviews.html" class="nav-link">Отзывы</a>
        </nav>
    </header>

    <main class="details-main">
            <div class="hotel-details-card">
                <img src="https://i8.photo.2gis.com/photo-gallery/390b797c-105e-4946-ac71-0ed6cb253506.jpg" 
                     alt="Отель Эрмитаж" 
                     class="hotel-image">

                <div class="details-info">
                    <h1 class="details-title">Сердце Сочи SunLine</h1>
                    <div class="price-address">
                        <p class="details-price">10 000 ₽ / сутки</p>
                        <p class="details-address">ул. Приморская, д. 4</p>
                    </div>

                    <div class="details-services">
                        <h2>Услуги:</h2>
                        <ul>
                            <li>Бесплатный Wi-Fi</li>
                            <li>Кондиционер</li>
                            <li>Ресторан</li>
                            <li>Спа-центр</li>
                            <li>Бассейн</li>
                            <li>Парковка</li>
                        </ul>
                    </div>

                    <div class="details-calendar">
                        <h2>Выберите даты:</h2>
                        <div class="date-inputs">
                            <div class="date-group">
                                <label>Заезд:</label>
                                <input type="date">
                            </div>
                            <div class="date-group">
                                <label>Выезд:</label>
                                <input type="date">
                            </div>
                        </div>

                    <button class="details-book-button">Забронировать</button>
                </div>
            </div>
        </div>
            <footer class="hotels-footer">
                <div class="footer-left">
                    <p>Мы в соц.сетях:</p>
                    <div class="social-links">
                        <a href="#">VK</a>
                        <a href="#">Instagram</a>
                    </div>
                </div>
                <div class="footer-right">
                    <a href="#">Политика конфиденциальности</a>
                </div>
            </footer>

</body>
</html>
